<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>بررسی نیابت فروش | شین گالری</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090c10;color:#f5f1e8;font:15px/2 Tahoma,Arial,sans-serif}.wrap{max-width:640px;margin:auto;padding:24px 16px}.brand{direction:ltr;text-align:center;letter-spacing:4px;font:900 25px Arial;color:#d6aa42}.panel{background:#13181e;border:1px solid #303841;border-radius:18px;padding:20px;margin:22px 0}h1{font-size:23px;text-align:center}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #303841}.row span:first-child{color:#aeb4bd}.notice{border-right:3px solid #d6aa42;background:#272013;padding:13px;border-radius:8px;margin-top:20px}.muted{color:#aeb4bd;font-size:13px}.error{color:#f39595}.text{white-space:pre-wrap;overflow-wrap:anywhere}input{display:block;width:100%;background:#090c10;color:#fff;border:1px solid #37404a;border-radius:11px;padding:12px;margin:6px 0 14px;font:inherit}label{display:block;color:#aeb4bd}button{border:0;border-radius:11px;background:#d6aa42;padding:12px 18px;font:inherit;color:#111}button:disabled{opacity:.4}@media(max-width:420px){.row{display:block}}</style></head><body><main class="wrap"><div class="brand">SHEEN GALLERY</div><h1>بررسی درخواست نیابت فروش</h1><div id="body" class="panel"><p>برای مشاهدهٔ شرایط، مشخصات ثبت‌شدهٔ مالک را وارد کنید.</p><form id="identify"><label>کد ملی<input name="nationalId" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="off"></label><label>شماره موبایل<input name="phone" type="tel" inputmode="tel" pattern="09[0-9]{9}" maxlength="11" required autocomplete="tel"></label><button type="submit">ادامه</button></form><p class="muted">بررسی شماره و ارسال کد پیامکی پس از اتصال سرویس احراز هویت فعال می‌شود. این مرحله تأیید مالک محسوب نمی‌شود.</p></div></main><script>
const box=document.getElementById('body'),token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=(a,b)=>`<div class="row"><span>${a}</span><strong>${esc(b)}</strong></div>`;
if(!/^[a-f0-9]{64}$/.test(token))box.innerHTML='<p class="error">لینک معتبر نیست.</p>';
else document.getElementById('identify').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;const values=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/agency/'+token+'/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values),cache:'no-store'});const a=await r.json();if(!r.ok)throw Error(a.error||'امکان دریافت قرارداد نیست');render(a)}catch(err){let p=document.getElementById('error');if(!p){p=document.createElement('p');p.id='error';p.className='error';form.append(p)}p.textContent=err.message}finally{button.disabled=false}};
function render(a){

box.innerHTML=`<p class="muted">نسخهٔ ${esc(a.version)} · معتبر تا ${esc(new Date(a.expiresAt).toLocaleString('fa-IR'))}</p>`+row('مالک',a.ownerName)+row('خودرو',a.car.title+' '+a.car.year)+row('کارکرد',a.car.mileage+' کیلومتر')+row('وضعیت بدنه',a.car.paint)+row('قیمت خالص مالک',Number(a.netPrice).toLocaleString('fa-IR')+' تومان')+row('کمیسیون',a.commission)+row('تسویه',a.settlement)+row('حدود اختیار',a.authority)+`<h3>شرایط تکمیلی</h3><p class="text">${esc(a.terms||'ثبت نشده')}</p><div class="notice">این صفحه فقط برای بررسی اطلاعات است. احراز هویت و امضای الکترونیکی هنوز متصل نشده و مشاهدهٔ آن به معنی تأیید قرارداد نیست.</div>`;
}
</script></body></html>
