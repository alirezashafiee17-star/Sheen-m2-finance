<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تأیید شرایط فروش | شین گالری</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#eee9df;font:15px/1.9 Tahoma,Arial}.wrap{max-width:720px;margin:auto;padding:24px 16px}.brand{text-align:center;color:#d6aa42;letter-spacing:4px;font:700 26px Arial}.card{background:#161b22;border:1px solid #363d45;border-radius:16px;padding:20px;margin:18px 0}h1{font-size:22px;text-align:center}h2{font-size:18px;color:#dfc17b}.muted{color:#b9bec6}.warning{border-right:4px solid #d6aa42;padding:12px;background:#2c2517}.field{display:block;margin:15px 0}input:not([type=checkbox]),textarea{display:block;width:100%;background:#0c1015;color:white;border:1px solid #525a64;border-radius:9px;padding:12px;font:inherit}button{background:#d6aa42;color:#171717;border:0;border-radius:9px;padding:12px 20px;font:inherit;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}button.secondary{background:#343b45;color:white}.file{margin:14px 0;padding:10px;border:1px solid #3b424b;border-radius:9px}img.contract{width:100%;max-height:700px;object-fit:contain;background:white}iframe{width:100%;height:550px;border:0}.error{color:#ff9b9b}.success{color:#9fd6a4}pre{white-space:pre-wrap;word-break:break-word;font:inherit}#app[hidden]{display:none}
@media print{body{background:white;color:black}#app,#message,#printReceipt{display:none}.card{border:0}} </style></head><body><main class="wrap"><div class="brand">SHEEN GALLERY</div><h1>تأیید شرایط فروش خودرو</h1><div id="message" role="status"></div><div id="receipt" class="card" hidden><h2>رسید ثبت تأیید</h2><pre id="receiptText"></pre><button id="printReceipt">چاپ یا ذخیرهٔ رسید</button></div><div id="app" hidden><div class="card" id="details"></div><div class="card"><h2>مدارک مالک</h2><p class="muted">تصاویر خوانا، هر فایل حداکثر ۲ مگابایت. اگر فروش با وکالت است، وکالت‌نامه هم لازم است.</p><div id="files"></div><label class="field"><input id="proxy" type="checkbox"> فروش با وکالت‌نامه انجام می‌شود</label></div><div class="card"><h2>متن نیابت‌نامهٔ وکیل</h2><p class="warning">هر دو صفحه را کامل بخوانید. اگر قیمت یا متن درست نیست، تأیید نکنید و درخواست اصلاح ثبت کنید.</p><div id="contracts"></div></div><div class="card"><h2>ثبت نظر مالک</h2><label class="field">نام و نام خانوادگی<input id="name" autocomplete="name"></label><label class="field">کد ملی<input id="nationalId" inputmode="numeric" maxlength="10"></label><label class="field">شماره همراه<input id="phone" inputmode="tel" maxlength="11"></label><label class="field"><input id="accepted" type="checkbox"> مشخصات خودرو، قیمت، شرایط و هر دو صفحهٔ نیابت‌نامه را خوانده‌ام و تأیید می‌کنم.</label><button id="submit">ثبت تأیید من</button><hr><label class="field">اطلاعات یا قیمت اشتباه است<textarea id="correction" rows="3" placeholder="مورد نیاز به اصلاح را بنویسید"></textarea></label><button class="secondary" id="correct">ارسال درخواست اصلاح</button></div></div></main><script>
const token=location.hash.slice(1);history.replaceState(null,"",location.pathname);const message=document.getElementById("message"),app=document.getElementById("app");let state,urls=[];
const say=(s,good=false)=>{message.innerHTML="";let p=document.createElement("p");p.className=good?"success":"error";p.textContent=s;message.append(p);};
async function api(path,options={}){const r=await fetch("/api/owner-agency"+path,{...options,headers:{"X-Agency-Token":token,...(options.body?{"Content-Type":"application/json"}:{})},cache:"no-store"});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error||"لینک معتبر نیست یا مهلت آن تمام شده است");}return r.headers.get("content-type")?.includes("application/json")?r.json():r.blob();}
const el=(tag,text)=>{let x=document.createElement(tag);x.textContent=text;return x;};
async function load(){if(!/^[a-f0-9]{64}$/.test(token))throw Error("لینک معتبر نیست");state=await api("");if(state.status==="owner_submitted"){say("تأیید شما ثبت شده و در انتظار بررسی شین گالری است.",true);return}
app.hidden=false;const d=document.getElementById("details");d.append(el("h2","مشخصات و شرایط"));for(const [key,value] of [["خودرو",state.car.title+" "+state.car.year],["قیمت پیشنهادی",Number(state.netPrice).toLocaleString("fa-IR")+" تومان"],["نسخهٔ شرایط",state.version],["اعتبار لینک",new Date(state.expiresAt).toLocaleString("fa-IR")],["نحوه تسویه",state.settlement],["حدود اختیار",state.authority],["کمیسیون",state.commission],["شرایط دیگر",state.terms]]){let p=el("p",key+": "+(value||"—"));d.append(p)}
if(state.revisionNote)d.append(el("p","درخواست اصلاح شین: "+state.revisionNote));
let filebox=document.getElementById("files");for(const [kind,label] of [["vehicle","سند خودرو یا برگ سبز"],["national_front","روی کارت ملی"],["national_back","پشت کارت ملی"],["power_of_attorney","وکالت‌نامه فروش (در صورت نیاز)"]]){let div=el("div","");div.className="file";div.append(el("label",label+" · "+(state.documents.find(x=>x.kind===kind)?.status||"بارگذاری نشده")));let input=document.createElement("input");input.type="file";input.accept="image/jpeg,image/png,image/webp,application/pdf";input.onchange=async()=>{let f=input.files[0];if(!f)return;if(f.size>2*1024*1024){say("حجم هر فایل باید کمتر از ۲ مگابایت باشد");return}try{input.disabled=true;let data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result.split(",")[1]);reader.onerror=reject;reader.readAsDataURL(f)});await api("/document/"+kind,{method:"PUT",body:JSON.stringify({mime:f.type,data})});say(label+" بارگذاری شد.",true);div.querySelector("label").textContent=label+" · بارگذاری شد";}catch(e){say(e.message)}finally{input.disabled=false}};div.append(input);filebox.append(div)}
for(let i=1;i<=2;i++){let blob=await api("/contract/"+i),url=URL.createObjectURL(blob);urls.push(url);let section=document.createElement("section");section.append(el("h3","صفحهٔ "+i));let view=blob.type==="application/pdf"?document.createElement("iframe"):document.createElement("img");view.src=url;if(view.tagName==="IMG")view.className="contract";view.title="صفحهٔ "+i+" نیابت‌نامه";section.append(view);let a=el("a","دریافت صفحهٔ "+i);a.href=url;a.download="agency-page-"+i+(blob.type==="application/pdf"?".pdf":".jpg");section.append(a);document.getElementById("contracts").append(section)}
}
document.getElementById("submit").onclick=async()=>{let button=document.getElementById("submit");button.disabled=true;try{let result=await api("/submit",{method:"POST",body:JSON.stringify({name:document.getElementById("name").value,phone:document.getElementById("phone").value,nationalId:document.getElementById("nationalId").value,accepted:document.getElementById("accepted").checked,hasPowerOfAttorney:document.getElementById("proxy").checked})});app.hidden=true;const receipt=document.getElementById("receipt");receipt.hidden=false;document.getElementById("receiptText").textContent="شین گالری | رسید ثبت تأیید شرایط فروش\nخودرو: "+state.car.title+" "+state.car.year+"\nقیمت پیشنهادی: "+Number(state.netPrice).toLocaleString("fa-IR")+" تومان\nنسخهٔ شرایط: "+result.version+"\nزمان ثبت: "+new Date(result.submittedAt).toLocaleString("fa-IR")+"\nشماره پیگیری: "+result.reference+"\nاثر ثبت: "+result.digest+"\nوضعیت: در انتظار بررسی نهایی شین گالری\nاین رسید احراز هویت رسمی یا امضای الکترونیکی مطمئن نیست.";say("تأیید شما ثبت شد و در انتظار بررسی شین گالری است.",true)}catch(e){say(e.message)}finally{button.disabled=false}};
document.getElementById("correct").onclick=async()=>{try{await api("/correction",{method:"POST",body:JSON.stringify({note:document.getElementById("correction").value})});say("درخواست اصلاح ثبت شد؛ تا اصلاح شرایط، تأیید نکنید.",true)}catch(e){say(e.message)}};
document.getElementById("printReceipt").onclick=()=>window.print();load().catch(e=>say(e.message));window.addEventListener("pagehide",()=>urls.forEach(URL.revokeObjectURL));
</script></body></html>
