<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sheen Finance</title><meta name="description" content="مدیریت مالی شین">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080a0d'/%3E%3Cpath d='M45 20H27c-6 0-8 8-2 11l14 7c6 3 4 11-2 11H19' fill='none' stroke='%23d6aa42' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#080a0d;--card:#11151a;--line:#252b32;--gold:#d6aa42;--text:#f6f3eb;--muted:#8b929b;--green:#42c58a;--red:#ef7474;--blue:#70a8ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#29200e 0,transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh}button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}.header{display:flex;align-items:center;justify-content:space-between;padding:20px 2px}.brand{direction:ltr;text-align:left;font-weight:900;letter-spacing:.16em;font-size:1.45rem}.brand span{display:block;color:var(--gold);font-size:.62rem;letter-spacing:.48em;margin-top:2px}.primary{border:0;background:var(--gold);color:#080a0d;font-weight:900;border-radius:13px;padding:12px 15px;cursor:pointer}.ghost{border:1px solid var(--line);background:#14191f;color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}.view{display:none}.view.active{display:block}.title{font-size:1.7rem;margin:8px 0 3px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric,.panel{background:linear-gradient(145deg,#13181e,#0f1318);border:1px solid var(--line);border-radius:18px}.metric{padding:17px;min-height:132px}.dot{width:9px;height:9px;border-radius:50%;margin-right:auto;margin-bottom:25px}.label{color:var(--muted);font-size:.86rem}.value{font-size:1.02rem;font-weight:900;margin-top:9px;direction:rtl}.panel{padding:17px;margin-top:14px}.panel h3{margin:0 0 13px}.share{padding:11px 0}.between{display:flex;justify-content:space-between;align-items:center}.bar{height:7px;border-radius:9px;background:#252a30;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--gold)}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.row:last-child{border-bottom:0}.edit{border:0;background:#1c2229;color:var(--gold);border-radius:10px;height:38px}.row-title{font-weight:800}.meta{color:var(--muted);font-size:.78rem;margin-top:5px}.amount{font-weight:900;text-align:left}.kind{font-size:.76rem;text-align:left;margin-top:5px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.report{background:#fff;color:#111;border-radius:19px;padding:24px;margin-top:18px}.report-brand{direction:ltr;font-size:1.25rem;font-weight:900;text-align:left}.report-brand b{color:#b58722}.report h2{text-align:right;margin:25px 0 8px}.goldline{height:2px;background:var(--gold);margin:14px 0}.report-row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:14px 0}.report-row strong{direction:rtl}.sign{border-top:1px solid #777;text-align:center;margin-top:56px;padding-top:10px;font-size:.75rem}.actions{display:flex;gap:8px;margin-top:12px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#0e1115f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:none;color:var(--muted);padding:18px 4px;font-weight:800}.tab.active{color:var(--gold)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:24px;background:#12161b;color:var(--text);padding:22px}dialog::backdrop{background:#000b}.modal-head{display:flex;justify-content:space-between}.x{background:none;border:0;color:var(--muted);font-size:1.7rem}.field{display:block;margin-top:14px;color:#abb0b6;font-size:.85rem}.field input,.field select{width:100%;margin-top:7px;background:#090c10;color:white;border:1px solid #2b3239;border-radius:12px;padding:13px;text-align:right}.save{width:100%;margin-top:20px}.empty{text-align:center;color:var(--muted);padding:25px}.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#20262d;border:1px solid #39414a;border-radius:12px;padding:11px 16px;display:none;z-index:20}@media(max-width:390px){.value{font-size:.88rem}.metric{padding:14px}.app{padding-left:12px;padding-right:12px}}@media print{body{background:#fff}.header,.nav,.no-print,.title,.sub{display:none!important}.app{padding:0}.view{display:none!important}#report{display:block!important}.report{margin:0;border-radius:0}.report h2{font-size:28px}}
  </style>
</head>
<body><main class="app"><header class="header"><div class="brand">SHEEN<span>FINANCE</span></div><button class="primary" id="add">＋ ثبت جدید</button></header>
  <section id="home" class="view active"><h1 class="title">نمای کلی مالی</h1><p class="sub">مشارکت ۴۰٪ شما / ۶۰٪ شریک</p><div class="grid" id="metrics"></div><div class="panel"><h3>تقسیم سود</h3><div id="shares"></div></div><div class="panel"><h3>آخرین تراکنش‌ها</h3><div id="recent"></div></div></section>
  <section id="transactions" class="view"><h1 class="title">تراکنش‌ها</h1><p class="sub">مبلغ، شرح و تاریخ همه موارد قابل ویرایش است.</p><div class="chips"><button class="ghost quick" data-kind="income">＋ درآمد</button><button class="ghost quick" data-kind="expense">＋ هزینه</button><button class="ghost quick" data-kind="withdrawal">＋ برداشت</button></div><div class="panel" id="allRows"></div></section>
  <section id="report" class="view"><h1 class="title">سند مالی</h1><p class="sub">آماده چاپ یا ذخیره به‌صورت PDF</p><div class="report"><div class="report-brand">SHEEN <b>FINANCE</b></div><h2>سند گزارش مالی</h2><div class="goldline"></div><div id="reportRows"></div><div class="sign">مهر و امضای مدیریت</div></div><div class="actions no-print"><button class="primary" onclick="print()">چاپ / ذخیره PDF</button><button class="ghost" id="share">اشتراک نسخه</button></div></section>
  </main><nav class="nav"><div class="nav-inner"><button class="tab active" data-view="home">داشبورد</button><button class="tab" data-view="transactions">تراکنش‌ها</button><button class="tab" data-view="report">سند مالی</button></div></nav>
  <dialog id="modal"><div class="modal-head"><h2 id="modalTitle">ثبت تراکنش</h2><button class="x" id="close">×</button></div><label class="field">نوع<select id="kind"><option value="income">دریافتی</option><option value="expense">هزینه</option><option value="withdrawal">برداشت</option></select></label><label class="field">مبلغ (تومان)<input id="amount" inputmode="numeric" placeholder="مثلاً ۵۰۰۰۰۰۰"></label><label class="field">شرح<input id="desc" placeholder="عنوان تراکنش"></label><label class="field">تاریخ و ساعت<input id="date" type="datetime-local"></label><button class="primary save" id="save">ذخیره</button></dialog><div class="toast" id="toast"></div>
<script>
const KEY='sheen-finance-v2';const seed=[{id:1,kind:'income',amount:1300000000,desc:'درآمد مجموعه',date:'2026-09-22T12:30'},{id:2,kind:'expense',amount:500000000,desc:'هزینه‌های مجموعه',date:'2026-09-22T12:45'}];let rows=[],editing=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],toman=n=>new Intl.NumberFormat('fa-IR').format(n)+' تومان';
function load(){try{const shared=new URL(location).hash.match(/^#data=(.+)$/);rows=shared?JSON.parse(decodeURIComponent(atob(shared[1]))):JSON.parse(localStorage.getItem(KEY)||'null')||seed}catch{rows=seed}saveLocal()}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(rows))}function stats(){let income=0,expense=0,withdrawal=0;rows.forEach(r=>{if(r.kind==='income')income+=r.amount;if(r.kind==='expense')expense+=r.amount;if(r.kind==='withdrawal')withdrawal+=r.amount});const profit=income-expense;return{income,expense,withdrawal,profit,cash:profit-withdrawal}}
const labels={income:'دریافتی',expense:'هزینه',withdrawal:'برداشت'},colors={income:'var(--green)',expense:'var(--red)',withdrawal:'var(--gold)'};function fmtDate(v){return new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}
function rowHTML(r){return `<div class="row"><button class="edit" data-edit="${r.id}">ویرایش</button><div><div class="row-title">${esc(r.desc)}</div><div class="meta">${fmtDate(r.date)}</div></div><div><div class="amount" style="color:${colors[r.kind]}">${toman(r.amount)}</div><div class="kind">${labels[r.kind]}</div></div></div>`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const s=stats();$('#metrics').innerHTML=[['کل درآمد',s.income,'var(--green)'],['کل هزینه',s.expense,'var(--red)'],['سود خالص',s.profit,'var(--gold)'],['موجودی صندوق',s.cash,'var(--blue)']].map(x=>`<div class="metric"><div class="dot" style="background:${x[2]}"></div><div class="label">${x[0]}</div><div class="value">${toman(x[1])}</div></div>`).join('');$('#shares').innerHTML=[[40,'سهم شما',s.profit*.4],[60,'سهم شریک',s.profit*.6]].map(x=>`<div class="share"><div class="between"><strong>${x[1]} <small class="label">${x[0]}٪</small></strong><b>${toman(x[2])}</b></div><div class="bar"><div class="fill" style="width:${x[0]}%"></div></div></div>`).join('');const sorted=[...rows].sort((a,b)=>new Date(b.date)-new Date(a.date));$('#recent').innerHTML=sorted.slice(0,3).map(rowHTML).join('')||'<div class="empty">هنوز تراکنشی ثبت نشده</div>';$('#allRows').innerHTML=sorted.map(rowHTML).join('')||'<div class="empty">هنوز تراکنشی ثبت نشده</div>';$('#reportRows').innerHTML=[['مجموع دریافتی',s.income],['مجموع هزینه',s.expense],['مجموع برداشت',s.withdrawal],['سود خالص',s.profit],['سهم شما (۴۰٪)',s.profit*.4],['سهم شریک (۶۰٪)',s.profit*.6]].map(x=>`<div class="report-row"><span>${x[0]}</span><strong>${toman(x[1])}</strong></div>`).join('');$$('[data-edit]').forEach(b=>b.onclick=()=>openModal(rows.find(r=>r.id==b.dataset.edit)))}
function localDT(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}function openModal(r=null,kind='income'){editing=r?.id||null;$('#modalTitle').textContent=r?'ویرایش تراکنش':'ثبت تراکنش';$('#kind').value=r?.kind||kind;$('#amount').value=r?.amount||'';$('#desc').value=r?.desc||'';$('#date').value=r?.date||localDT();$('#modal').showModal()}
$('#add').onclick=()=>openModal();$('#close').onclick=()=>$('#modal').close();$$('.quick').forEach(b=>b.onclick=()=>openModal(null,b.dataset.kind));$('#save').onclick=()=>{const amount=Number($('#amount').value.replace(/[,٬]/g,'')),desc=$('#desc').value.trim(),date=$('#date').value,kind=$('#kind').value;if(!amount||!desc||!date)return toast('مبلغ، شرح و تاریخ را کامل کن');if(editing)rows=rows.map(r=>r.id===editing?{...r,amount,desc,date,kind}:r);else rows.push({id:Date.now(),amount,desc,date,kind});saveLocal();render();$('#modal').close();toast('ذخیره شد')};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));scrollTo(0,0)});$('#share').onclick=async()=>{const data=btoa(encodeURIComponent(JSON.stringify(rows)));const url=location.origin+location.pathname+'#data='+data;try{await navigator.clipboard.writeText(url);toast('لینک حاوی اطلاعات کپی شد')}catch{prompt('لینک اشتراک',url)}};function toast(v){$('#toast').textContent=v;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}load();render();
</script></body></html>
